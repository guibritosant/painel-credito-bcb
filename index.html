<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crédito PF – recursos livres</title>
<meta name="description" content="Saldo do crédito às pessoas físicas com recursos livres, por modalidade (Tabela 7 das Estatísticas monetárias e de crédito do Banco Central do Brasil).">
<style>:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #6f6d67;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.12); --wash: #f0efec;
  --accent: #184f95; --accent-wash: #e4eefb;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948;
  --div-pos: #2a78d6; --div-neg: #e34948;
  --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --good-ink: #006300;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #a09e96;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.12); --wash: #232322;
    --accent: #86b6ef; --accent-wash: #16273b;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
    --div-pos: #3987e5; --div-neg: #e66767; --good-ink: #0ca30c;
  }
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 var(--font); }
a { color: var(--accent); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px;
}
.skip { position: absolute; left: -999px; top: 8px; background: var(--surface); padding: 8px 12px; z-index: 20; }
.skip:focus { left: 8px; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- cabeçalho ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--border); padding: 22px 0 0; }
.top h1 { margin: 0; font-size: 26px; line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; }
.top .sub { margin: 4px 0 0; color: var(--ink2); max-width: 70ch; }
.ledger { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); margin: 20px 0 0; border-top: 1px solid var(--border); }
.ledger > div { padding: 12px 16px 14px 0; min-width: 0; }
.ledger dt { font-size: 13px; color: var(--ink2); margin: 0 0 2px; }
.ledger dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
.ledger dd small { display: block; font-weight: 400; color: var(--ink2); font-size: 13px; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; }
.badge svg { flex: none; }

/* ---------- abas ---------- */
.tabs { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--border); }
.tabs .wrap { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
.tabs button { appearance: none; border: 0; background: none; font: inherit; color: var(--ink2); padding: 12px 14px; cursor: pointer;
  white-space: nowrap; border-bottom: 3px solid transparent; margin-bottom: -1px; }
.tabs button:hover { color: var(--ink); background: var(--wash); }
.tabs button[aria-selected="true"] { color: var(--ink); font-weight: 650; border-bottom-color: var(--accent); }

main { padding: 24px 0 56px; }
section.panel[hidden] { display: none; }
h2 { font-size: 19px; margin: 0 0 4px; font-weight: 650; }
h3 { font-size: 15px; margin: 0 0 8px; font-weight: 650; }
.lede { color: var(--ink2); margin: 0 0 16px; max-width: 75ch; }
.block { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 16px; margin: 0 0 20px; }
.block > h3:first-child, .block > h2:first-child { margin-top: 0; }
.note { color: var(--ink2); font-size: 13px; margin: 8px 0 0; }
.notice { border-left: 3px solid var(--axis); background: var(--wash); padding: 8px 12px; margin: 0 0 8px; font-size: 14px; border-radius: 0 4px 4px 0; }
.notice.preliminar { border-left-color: var(--warn); }
.notice.revisao { border-left-color: var(--s1); }
.notice.ausente { border-left-color: var(--s4); }

/* ---------- KPIs ---------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); margin: 0 0 20px; overflow: hidden; }
.kpi { padding: 14px 16px; border-right: 1px solid var(--grid); border-bottom: 1px solid var(--grid); margin: 0 -1px -1px 0; min-width: 0; }
.kpi h3 { font-size: 13px; font-weight: 500; color: var(--ink2); margin: 0 0 6px; }
.kpi .v { font-size: 26px; font-weight: 650; letter-spacing: -0.01em; line-height: 1.15; }
.kpi .u { color: var(--ink2); font-size: 13px; }
.kpi .chg { display: flex; gap: 14px; margin: 8px 0 6px; font-size: 13px; flex-wrap: wrap; }
.kpi .chg b { font-weight: 600; }
.kpi .chg span { color: var(--ink2); }
.kpi svg { display: block; margin-top: 6px; }

.cols { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 900px) { .cols.two { grid-template-columns: 1fr 1fr; } }

/* ---------- controles ---------- */
.controls { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end; margin: 0 0 14px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink2); min-width: 0; }
.field > span { font-weight: 500; }
select, input[type="search"], input[type="text"] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface);
  border: 1px solid var(--axis); border-radius: 5px; padding: 7px 9px; min-height: 36px; max-width: 100%; }
.btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--axis); border-radius: 5px;
  padding: 7px 12px; min-height: 36px; cursor: pointer; }
.btn:hover { background: var(--wash); }
.btn.primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
.btn[disabled] { opacity: .45; cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--axis); border-radius: 5px; overflow: hidden; flex-wrap: wrap; }
.seg button { font: inherit; font-size: 13.5px; background: var(--surface); color: var(--ink); border: 0; border-right: 1px solid var(--axis);
  padding: 7px 11px; min-height: 36px; cursor: pointer; }
.seg button:last-child { border-right: 0; }
.seg button:hover { background: var(--wash); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--ink); font-weight: 650; box-shadow: inset 0 -2px 0 var(--accent); }
.check { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; color: var(--ink); min-height: 36px; }

.picker { border: 1px solid var(--axis); border-radius: 6px; background: var(--surface); }
.picker .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; border-bottom: 1px solid var(--grid); min-height: 44px; }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--wash); border-radius: 999px; padding: 3px 4px 3px 10px; font-size: 13px; }
.chip i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.chip button { border: 0; background: none; cursor: pointer; font-size: 15px; line-height: 1; color: var(--ink2); padding: 2px 6px; border-radius: 999px; }
.chip button:hover { background: var(--grid); color: var(--ink); }
.picker input[type="search"] { width: 100%; border: 0; border-bottom: 1px solid var(--grid); border-radius: 0; }
.picker ul { list-style: none; margin: 0; padding: 4px 0; max-height: 260px; overflow: auto; }
.picker li label { display: flex; gap: 8px; align-items: flex-start; padding: 5px 10px; cursor: pointer; font-size: 14px; }
.picker li label:hover { background: var(--wash); }
.picker li.child label { padding-left: 28px; color: var(--ink2); }
.picker li.group { padding: 8px 10px 2px; font-size: 12.5px; color: var(--ink2); font-weight: 600; }
.picker li[aria-disabled="true"] label { opacity: .45; cursor: not-allowed; }
.picker .hint { font-size: 12.5px; color: var(--ink2); padding: 6px 10px; border-top: 1px solid var(--grid); }

.evo-grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
.evo-grid > div { min-width: 0; }
@media (min-width: 980px) { .evo-grid { grid-template-columns: 300px minmax(0, 1fr); align-items: start; } }

/* ---------- gráficos ---------- */
.chart { position: relative; width: 100%; }
.chart svg { display: block; max-width: 100%; touch-action: pan-y; }
.chart svg text { font-family: var(--font); font-variant-numeric: tabular-nums; }
.legend { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 8px 0 0; padding: 0; font-size: 13px; color: var(--ink2); }
.legend i, .tip-r i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; z-index: 5; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--axis);
  border-radius: 6px; padding: 8px 10px; font-size: 13px; min-width: 190px; max-width: 320px; box-shadow: 0 2px 10px rgba(0, 0, 0, .12); }
.tip-h { font-weight: 650; margin-bottom: 4px; }
.tip-r { display: flex; align-items: baseline; gap: 4px; }
.tip-r span { flex: 1; min-width: 0; }
.tip-r b { font-variant-numeric: tabular-nums; font-weight: 600; margin-left: 10px; }
.tip-x { color: var(--ink2); font-size: 12.5px; margin: 0 0 3px 16px; font-variant-numeric: tabular-nums; }

.bars { position: relative; }
.bars ol { list-style: none; margin: 0; padding: 0; }
.bars li { display: grid; grid-template-columns: minmax(110px, 36%) 1fr minmax(64px, auto); gap: 10px; align-items: center; padding: 4px 2px; border-radius: 4px; }
.bars li:hover, .bars li:focus-visible { background: var(--wash); }
.b-l { font-size: 13.5px; overflow-wrap: anywhere; line-height: 1.25; }
.b-l abbr { text-decoration: none; cursor: help; }
.b-t { position: relative; height: 18px; display: block; }
.b-t em { position: absolute; top: 3px; height: 12px; border-radius: 0 4px 4px 0; display: block; }
.b-t u { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--ink2); }
.b-v { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13.5px; text-align: right; white-space: nowrap; }

/* ---------- tabelas ---------- */
.tablewrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; background: var(--wash); position: sticky; top: 0; white-space: nowrap; }
th button { all: unset; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; }
th button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
tbody tr:hover { background: var(--wash); }
.pager { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-top: 10px; font-size: 14px; }
.tag { font-size: 12px; border: 1px solid var(--axis); border-radius: 3px; padding: 0 5px; color: var(--ink2); white-space: nowrap; }

dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 18px; margin: 0; }
dl.facts dt { color: var(--ink2); }
dl.facts dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 560px) { dl.facts { grid-template-columns: 1fr; gap: 0; } dl.facts dd { margin-bottom: 8px; } }
code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--wash); padding: 1px 5px; border-radius: 3px; }
.formula { background: var(--wash); border-radius: 5px; padding: 8px 12px; margin: 6px 0 10px; font-variant-numeric: tabular-nums; overflow-x: auto; }
.fatal { padding: 40px 16px; text-align: center; }
ul.plain { margin: 0; padding-left: 18px; }
ul.plain li { margin: 0 0 6px; }

@media (max-width: 560px) {
  .top h1 { font-size: 22px; }
  .kpi .v { font-size: 23px; }
  .bars li { grid-template-columns: 1fr minmax(64px, auto); }
  .bars .b-t { grid-column: 1 / -1; order: 3; }
}
@media print { .tabs, .controls { display: none; } section.panel[hidden] { display: block; } }
</style>
</head>

  /* cfg: { labels:['2011-03',..], series:[{id,name,color,values:[..|null]}], fmtTick(v), fmtValue(v),

  function lineChart(host, cfg) {

    ser.forEach(function (x) {

      for (var k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 15) ends[k].y = ends[k - 1].y + 15;

      else if (e.key === 'ArrowRight') { show(Math.min(n - 1, (cur == null ? n - 1 : cur) + 1)); e.preventDefault(); }
      else if (e.key === 'Escape') clear();

    if (cfg.series.length >= 2) {

      cfg.series.forEach(function (x) {
        var li = document.createElement('li');
        li.innerHTML = '<i style="background:' + x.color + '"><\/i>' + esc(x.name);

  /* cfg: { items:[{id,label,value,valueText,sub,flag}], color, negColor, ariaLabel, tipHtml(item) } */
  function barChart(host, cfg) {

        (neg ? (cfg.negColor || cv('--div-neg')) : (cfg.color || cv('--s1'))) + '"><\/em><\/span>' +

  function sparkline(values, w, h, color) {

<script>/* Painel de crédito PF – recursos livres (Tabela 7 do BCB).

  var TOTAL = M.total_id;

  function lab(c) { return MES[+c.slice(5) - 1] + '/' + c.slice(0, 4); }

      { title: 'Modalidades', ids: [], tree: princ }];

    var q = norm(tb.q.trim());
    tbView = allRows.filter(function (r) {
      if (r.i < tb.from || r.i > tb.to) return false;
      if (tb.papel && r.papel !== tb.papel) return false;
      if (tb.grupo && r.grupo !== tb.grupo && r.id !== tb.grupo) return false;
      if (tb.prelOnly && !r.prelim) return false;
      if (!tb.missing && r.st !== 'o') return false;
      if (q && norm(r.nome).indexOf(q) < 0) return false;
      return true;
    });
    var k = tb.sort.key, d = tb.sort.dir;
    tbView.sort(function (a, b) {
      var x = a[k], y = b[k];
      if (k === 'nome' || k === 'papel') return d * String(x).localeCompare(String(y), 'pt-BR') || a.i - b.i;
      if (x == null && y == null) return a.i === b.i ? a.ordem - b.ordem : b.i - a.i;
      if (x == null) return 1; if (y == null) return -1;
      return d * (x - y) || a.ordem - b.ordem;
    });
  }
  function csvCell(v) { var t = String(v); return /[;"\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; }
  function exportCsv() {
    var br = tb.fmt === 'br';
    function n(v, d) { if (v == null) return ''; var t = d == null ? String(v) : v.toFixed(d); return br ? t.replace('.', ',') : t; }
    var head = ['competencia', 'serie', 'codigo_sgs', 'classificacao', 'modalidade_principal', 'unidade', 'valor_original', 'valor', 'variacao_mensal_pct', 'variacao_12m_pct',
      'variacao_mensal_absoluta', 'variacao_12m_absoluta', 'preliminar', 'status', 'publicacao', 'fonte'];
    var stn = { o: 'ok', v: 'ausente', s: 'simbolo' };
    var lines = [head.join(';')].concat(tbView.map(function (r) {
      return [r.c, r.nome, r.sgs, r.papel, r.grupo ? BY[r.grupo].nome : '', M.unidade, r.orig, n(r.valor), n(r.mom, 4), n(r.yoy, 4), n(r.momA), n(r.yoyA),
        r.prelim ? 'sim' : 'nao', stn[r.st], M.publicacao_id, M.fonte_pagina].map(csvCell).join(';');
    }));
    var blob = new Blob(['﻿' + lines.join('\r\n') + '\r\n'], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'credito_pf_recursos_livres_' + M.publicacao_id + '_filtrado.csv';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }

  TABS.tabela = {
    build: function () {
      buildRows();
      var el = document.getElementById('tab-tabela');
      var gopts = '<option value="">Todas<\/option>' + M.principais.map(function (p) { return '<option value="' + p + '">' + esc(nameOf(p)) + '<\/option>'; }).join('');
      el.innerHTML = '<h2>Tabela detalhada<\/h2><p class="lede">Todas as séries e competências extraídas, com o valor original da fonte. Os filtros valem também para a exportação.<\/p>' +
        '<div class="controls"><label class="field"><span>Buscar por nome<\/span><input type="search" id="t-q" placeholder="ex.: consignado"><\/label>' +
        monthSelect('t-from', 'De', 0) + monthSelect('t-to', 'Até', N - 1) +
        '<label class="field"><span>Classificação<\/span><select id="t-papel"><option value="">Todas<\/option><option>Total<\/option><option>Subtotal<\/option><option>Modalidade<\/option><\/select><\/label>' +
        '<label class="field"><span>Modalidade principal<\/span><select id="t-grupo">' + gopts + '<\/select><\/label><\/div>' +
        '<div class="controls"><label class="check"><input type="checkbox" id="t-prel"> Somente preliminares<\/label>' +
        '<label class="check"><input type="checkbox" id="t-miss"> Incluir células ausentes<\/label>' +
        '<label class="field"><span>Formato do CSV<\/span><select id="t-fmt"><option value="br">Excel pt-BR (vírgula decimal)<\/option><option value="us">Ponto decimal<\/option><\/select><\/label>' +
        '<button class="btn primary" id="t-csv" type="button">Exportar CSV filtrado<\/button><\/div>' +
        '<div class="tablewrap"><table id="t-table"><\/table><\/div>' +
        '<div class="pager"><span id="t-count"><\/span><span><label>Linhas por página <select id="t-size"><option>25<\/option><option selected>50<\/option><option>100<\/option><\/select><\/label> ' +
        '<button class="btn" id="t-prev" type="button">Anterior<\/button> <span id="t-page" class="num"><\/span> <button class="btn" id="t-next" type="button">Próxima<\/button><\/span><\/div>';
      function refresh() { tb.page = 0; TABS.tabela.draw(); }
      document.getElementById('t-q').addEventListener('input', function (e) { tb.q = e.target.value; refresh(); });
      document.getElementById('t-from').onchange = function (e) { tb.from = +e.target.value; refresh(); };
      document.getElementById('t-to').onchange = function (e) { tb.to = +e.target.value; refresh(); };
      document.getElementById('t-papel').onchange = function (e) { tb.papel = e.target.value; refresh(); };
      document.getElementById('t-grupo').onchange = function (e) { tb.grupo = e.target.value; refresh(); };
      document.getElementById('t-prel').onchange = function (e) { tb.prelOnly = e.target.checked; refresh(); };
      document.getElementById('t-miss').onchange = function (e) { tb.missing = e.target.checked; refresh(); };
      document.getElementById('t-fmt').onchange = function (e) { tb.fmt = e.target.value; };
      document.getElementById('t-size').onchange = function (e) { tb.size = +e.target.value; refresh(); };
      document.getElementById('t-prev').onclick = function () { if (tb.page > 0) { tb.page--; TABS.tabela.draw(); } };
      document.getElementById('t-next').onclick = function () { tb.page++; TABS.tabela.draw(); };
      document.getElementById('t-csv').onclick = exportCsv;
      document.getElementById('t-table').addEventListener('click', function (e) {
        var b = e.target.closest('button[data-k]'); if (!b) return;
        var k = b.getAttribute('data-k');
        tb.sort = { key: k, dir: tb.sort.key === k ? -tb.sort.dir : (k === 'nome' || k === 'papel' ? 1 : -1) }; tb.page = 0; TABS.tabela.draw();
      });
    },
    draw: function () {
      filterRows();
      var pages = Math.max(1, Math.ceil(tbView.length / tb.size)); if (tb.page >= pages) tb.page = pages - 1;
      var slice = tbView.slice(tb.page * tb.size, tb.page * tb.size + tb.size);
      function th(k, text, n) {
        var cur = tb.sort.key === k;
        return '<th class="' + (n ? 'n' : '') + '" aria-sort="' + (cur ? (tb.sort.dir > 0 ? 'ascending' : 'descending') : 'none') + '"><button type="button" data-k="' + k + '">' + text + (cur ? (tb.sort.dir > 0 ? ' ▲' : ' ▼') : '') + '<\/button><\/th>';
      }
      document.getElementById('t-table').innerHTML = '<thead><tr>' + th('i', 'Competência', false) + th('nome', 'Série', false) + th('papel', 'Classificação', false) +
        th('valor', 'Saldo (R$ mi)', true) + '<th class="n">Valor original<\/th>' + th('mom', 'Var. mensal', true) + th('yoy', 'Var. 12 meses', true) + '<th>Situação<\/th><\/tr><\/thead><tbody>' +
        (slice.map(function (r) {
          var sit = r.st === 'v' ? '<span class="tag">ausente<\/span>' : r.st === 's' ? '<span class="tag">símbolo<\/span>' : (r.prelim ? '<span class="tag">preliminar<\/span>' : '');
          return '<tr><td class="num">' + lab(r.c) + '<\/td><td>' + esc(r.nome) + '<\/td><td>' + r.papel + '<\/td><td class="n">' + fInt(r.valor) + '<\/td><td class="n">' + esc(r.orig || '—') +
            '<\/td><td class="n">' + fPct(r.mom) + '<\/td><td class="n">' + fPct(r.yoy) + '<\/td><td>' + sit + '<\/td><\/tr>';
        }).join('') || '<tr><td colspan="8">Nenhuma linha para os filtros atuais.<\/td><\/tr>') + '<\/tbody>';
      document.getElementById('t-count').textContent = nf0.format(tbView.length) + ' linhas';
      document.getElementById('t-page').textContent = 'Página ' + (tb.page + 1) + ' de ' + pages;
      document.getElementById('t-prev').disabled = tb.page === 0; document.getElementById('t-next').disabled = tb.page >= pages - 1;
    }
  };

  /* ============================================ METODOLOGIA */
  TABS.metodologia = {
    build: function () {
      var el = document.getElementById('tab-metodologia');
      var rev = D.revisoes.length ? '<div class="tablewrap"><table><thead><tr><th>Competência<\/th><th>Série<\/th><th>Tipo<\/th><th class="n">Anterior<\/th><th class="n">Novo<\/th><th>Publicação<\/th><\/tr><\/thead><tbody>' +
        D.revisoes.slice(0, 100).map(function (r) {
          return '<tr><td>' + lab(r.competencia) + '<\/td><td>' + esc(short(r.serie)) + '<\/td><td>' + esc(r.tipo) + '<\/td><td class="n">' + fRev(r.anterior) + '<\/td><td class="n">' + fRev(r.novo) +
            '<\/td><td>' + esc(r.publicacao_anterior) + ' → ' + esc(r.publicacao_nova) + '<\/td><\/tr>';
        }).join('') + '<\/tbody><\/table><\/div>' : '<p class="note">Nenhuma revisão registrada até agora.<\/p>';
      el.innerHTML = '<h2>Fonte e metodologia<\/h2>' +
        '<div class="block"><h3>Fonte e publicação<\/h3><dl class="facts">' +
        '<dt>Tabela<\/dt><dd>' + esc(M.titulo_tabela) + '<\/dd>' +
        '<dt>Fonte oficial<\/dt><dd><a href="' + esc(M.fonte_pagina) + '" rel="noopener">' + esc(M.fonte_pagina) + '<\/a><\/dd>' +
        '<dt>Histórico de publicações<\/dt><dd><a href="' + esc(M.fonte_historico) + '" rel="noopener">' + esc(M.fonte_historico) + '<\/a><\/dd>' +
        '<dt>Publicação<\/dt><dd class="num">' + esc(M.publicacao_id) + ' · ' + esc(M.arquivo) + '<\/dd>' +
        '<dt>Arquivo de origem<\/dt><dd>' + (M.fonte_url_arquivo ? '<a href="' + esc(M.fonte_url_arquivo) + '" rel="noopener">' + esc(M.fonte_url_arquivo) + '<\/a>' : 'arquivo fornecido manualmente; URL de download não registrada') + '<\/dd>' +
        '<dt>Integridade (SHA-256)<\/dt><dd><code>' + esc(M.sha256) + '<\/code><\/dd>' +
        '<dt>Coleta<\/dt><dd class="num">' + esc(fDT(M.coletado_em)) + '<\/dd>' +
        '<dt>Cobertura<\/dt><dd class="num">' + lab(M.competencia_inicial) + ' a ' + lab(M.competencia_final) + ' · ' + N + ' competências · ' + SER.length + ' séries<\/dd>' +
        '<dt>Dados gerados em<\/dt><dd class="num">' + esc(fDT(M.gerado_em)) + '<\/dd><\/dl>' +
        '<p class="note">A competência é a do dado (mês de referência), nunca a data de execução da rotina.<\/p><\/div>' +
        '<div class="block"><h3>Avisos sobre os dados<\/h3>' + D.avisos.map(function (a) { return '<p class="notice ' + esc(a.tipo) + '">' + esc(a.texto) + '<\/p>'; }).join('') + '<\/div>' +
        '<div class="block"><h3>Fórmulas e critérios<\/h3>' +
        '<div class="formula">Variação mensal (%) = (saldo do mês ÷ saldo do mês anterior − 1) × 100<\/div>' +
        '<div class="formula">Variação em 12 meses (%) = (saldo do mês ÷ saldo 12 meses antes − 1) × 100<\/div>' +
        '<div class="formula">Variação absoluta = saldo atual − saldo de referência (em R$ milhões)<\/div>' +
        '<div class="formula">Participação (%) = saldo da série ÷ saldo total na mesma competência × 100<\/div>' +
        '<div class="formula">Índice base 100 = saldo ÷ primeiro saldo disponível da série no intervalo × 100<\/div>' +
        '<ul class="plain"><li>Variações percentuais só são calculadas quando os dois saldos existem e o de referência é maior que zero; caso contrário aparece “—”.<\/li>' +
        '<li>Células vazias na fonte são tratadas como <b>ausentes<\/b>, nunca como zero. Zero e ausente são distintos.<\/li>' +
        '<li>Os indicadores se aplicam a <b>saldos<\/b> (estoques) em R$ milhões, a única natureza de dado da Tabela 7.<\/li>' +
        '<li>Séries com participação inferior a ' + nf1.format(M.pequena_base_pct) + '% do total recebem o aviso ⚠ de base pequena (critério do painel, não do BCB).<\/li>' +
        '<li>As variações calculadas são conferidas, a cada atualização, com as variações publicadas pelo próprio BCB no arquivo (tolerância de arredondamento).<\/li>' +
        '<li>Os números exibidos em “R$ bilhões/trilhões” são só conversão de exibição; os dados e a exportação usam R$ milhões.<\/li><\/ul><\/div>' +
        '<div class="block"><h3>Conferências de consistência<\/h3><ul class="plain">' + M.identidades.map(function (t) { return '<li>' + esc(t) + '<\/li>'; }).join('') +
        '<\/ul><p class="note">Cada identidade é verificada para todas as competências com tolerância de arredondamento. Esta hierarquia foi inferida pelos nomes oficiais e confirmada numericamente.<\/p><\/div>' +
        '<div class="block"><h3>Pontos em aberto<\/h3><ul class="plain">' + D.duvidas.map(function (t) { return '<li>' + esc(t) + '<\/li>'; }).join('') + '<\/ul><\/div>' +
        '<div class="block"><h3>Séries e unidades<\/h3><div class="tablewrap"><table><thead><tr><th>Série (nome oficial)<\/th><th>Código SGS<\/th><th>Unidade<\/th><th>Classificação<\/th><th>Início<\/th><th>Nota do BCB<\/th><\/tr><\/thead><tbody>' +
        SER.map(function (s) {
          return '<tr><td>' + esc(s.nome) + '<br><span class="note">' + esc(s.nome_en) + '<\/span><\/td><td class="num">' + esc(s.sgs) + '<\/td><td>' + esc(s.unidade) + '<\/td><td>' + s.papel +
            '<\/td><td class="num">' + (s.primeira_competencia ? lab(s.primeira_competencia) : '—') + '<\/td><td>' + (s.nota ? esc(s.nota_id + '/ ' + s.nota) : '') + '<\/td><\/tr>';
        }).join('') + '<\/tbody><\/table><\/div><\/div>' +
        '<div class="block"><h3>Revisões registradas<\/h3>' + rev + '<\/div>' +
        '<div class="block"><h3>Publicações processadas<\/h3><div class="tablewrap"><table><thead><tr><th>Publicação<\/th><th>Arquivo<\/th><th>Competência final<\/th><th>Coleta<\/th><th class="n">Revisões<\/th><\/tr><\/thead><tbody>' +
        D.publicacoes.map(function (p) { return '<tr><td class="num">' + esc(p.publicacao_id) + '<\/td><td>' + esc(p.arquivo) + '<\/td><td>' + lab(p.competencia_final) + '<\/td><td class="num">' + esc(fDT(p.coletado_em)) + '<\/td><td class="n">' + esc(p.n_revisoes) + '<\/td><\/tr>'; }).join('') +
        '<\/tbody><\/table><\/div><\/div>';
    }
  };

  /* ================================================ inicialização */
  renderHeader();
  document.querySelector('.tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (b) show(b.getAttribute('data-tab'));
  });
  document.querySelector('.tabs').addEventListener('keydown', function (e) {
    if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
    var names = ['geral', 'evolucao', 'comparacao', 'tabela', 'metodologia'], i = names.indexOf(activeTab);
    var n = names[(i + (e.key === 'ArrowRight' ? 1 : names.length - 1)) % names.length]; show(n); document.getElementById('t-' + n).focus();
  });
  var rz; function redraw() { clearTimeout(rz); rz = setTimeout(function () { var t = TABS[activeTab]; if (t && t.draw && activeTab !== 'tabela') t.draw(); }, 120); }
  window.addEventListener('resize', redraw);
  if (window.matchMedia) window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { renderHeader(); redraw(); });
  show((location.hash || '#geral').slice(1));
})();
</script>
</body>
